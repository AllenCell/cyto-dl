name: Tests

on:
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

# Cancel actions when new commits are pushed to PR
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # NOTE: the `equiv` extra is intentionally excluded from CI because the
      # `lie_learn` source distribution requires manual C-source patching on
      # Python >= 3.12 (see ugly_install.sh). Re-add when lie_learn ships a
      # Python 3.12-compatible release.
      - name: Install dependencies
        run: |
          uv sync --extra spharm --extra s3 --extra torchserve --extra pcloud --extra test

      - name: List dependencies
        run: uv pip list

      - name: Run pytest
        run: uv run pytest -v

  # upload code coverage report
  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra spharm --extra s3 --extra torchserve --extra pcloud --extra test

      - name: Run tests and collect coverage
        run: uv run pytest --cov cyto_dl --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
