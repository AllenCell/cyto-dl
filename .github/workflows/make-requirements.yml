name: Make requirements files

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  make-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: "pyproject.toml"
          # Pin to a recent uv release. Bump deliberately when needed.
          version: "0.10.2"
      - name: Generate lockfile and requirements files
        shell: bash
        run: |
          rm -rf requirements/
          make sync-reqs-files
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update lockfile and requirements files
