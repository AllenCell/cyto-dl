---
name: publish
on:
  push:
    branches:
      - main
    paths:
      - version.toml
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for PyPI Trusted Publishing
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      # NOTE: After migrating from AllenCellModeling/cyto-dl to AllenCell/cyto-dl,
      # the PyPI Trusted Publisher entry must be re-registered for the new
      # owner/repo, otherwise this step fails with `invalid-publisher`.
      # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
